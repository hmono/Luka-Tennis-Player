name: Update ATP Rankings
run-name: ATP rankings ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'collect-and-deliver' }}

# Publication-driven polling every day, twice daily. No ATP calendar renewal.
# The independent external watchdog detects missing runs; cron is best effort.
on:
  schedule:
    - cron: '17 12,18 * * *'
    - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'collect-and-deliver persists and notifies; dry-run validates without writes or sends'
        type: choice
        options:
          - collect-and-deliver
          - dry-run
        default: dry-run

permissions:
  contents: write
  actions: read

concurrency:
  group: repository-data-writer-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Dry-run follows the selected branch. Production is explicitly main-only.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record expected slot and actual workflow start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '{created_at: .created_at, run_started_at: .run_started_at}' > "${RUNNER_TEMP}/atp-run-timing.json"
          python scripts/update_rankings.py telemetry --event-name "${GITHUB_EVENT_NAME}" --run-metadata "${RUNNER_TEMP}/atp-run-timing.json"

      - name: Require explicit release for collect-and-deliver
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'collect-and-deliver' && (vars.ATP_RANKING_DELIVERY_ENABLED != 'true' || github.ref != 'refs/heads/main')
        run: |
          echo 'Collection and delivery require main and explicit initial release approval via ATP_RANKING_DELIVERY_ENABLED=true.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Install automation dependencies
        run: pip install -r requirements-automation.txt

      - name: Install Chromium
        run: playwright install chromium --with-deps

      - name: Run ranking-alert tests
        run: python -m unittest discover -s tests/ranking_alerts

      - name: Dry run against the live ITF source
        if: inputs.mode == 'dry-run' || (github.event_name == 'schedule' && vars.ATP_RANKING_DELIVERY_ENABLED != 'true')
        run: python scripts/autonomous_rankings.py run --dry-run

      - name: Collect persist and deliver autonomous ranking cycle
        if: vars.ATP_RANKING_DELIVERY_ENABLED == 'true' && inputs.mode != 'dry-run' && github.ref == 'refs/heads/main'
        env:
          ATP_RANKING_DELIVERY_ENABLED: ${{ vars.ATP_RANKING_DELIVERY_ENABLED }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          ATP_OPS_WEBHOOK_URL: ${{ secrets.ATP_OPS_WEBHOOK_URL }}
          ATP_OPS_WEBHOOK_TOKEN: ${{ secrets.ATP_OPS_WEBHOOK_TOKEN }}
          ATP_WATCHDOG_STATE_DIR: ${{ runner.temp }}/atp-ranking-ops
        # Runtime pushes each intention/claim before network I/O and receipts
        # afterwards. Monday 09:00 Sao Paulo weekly status is ledger-deduplicated
        # independently of edition alerts; first subsequent poll catches up.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/autonomous_rankings.py run
