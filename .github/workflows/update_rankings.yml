name: Update ATP Rankings

# ATP publishes on Monday; the ITF profile carries the new publication the
# same day. Tuesday 09:00 UTC leaves a full day of slack.
on:
  push:
    branches: [claude/loving-planck-xg0ery]
  schedule:
    - cron: '0 9 * * 2'
  workflow_dispatch:
    inputs:
      mode:
        description: 'collect-and-deliver persists and notifies; dry-run only validates the live source'
        type: choice
        options:
          - collect-and-deliver
          - dry-run
        default: collect-and-deliver

permissions:
  contents: write

concurrency:
  group: repository-data-writer-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install automation dependencies
        run: pip install -r requirements-automation.txt

      - name: Install Chromium
        run: playwright install chromium --with-deps

      - name: Run ranking-alert tests
        run: python -m unittest discover -s tests/ranking_alerts

      - name: Dry run against the live ITF source
        if: inputs.mode == 'dry-run' || github.event_name == 'push'
        run: python scripts/update_rankings.py dry-run --source itf

      - name: Collect ranking snapshot
        if: inputs.mode != 'dry-run' && github.event_name != 'push'
        run: python scripts/update_rankings.py collect --source itf

      - name: Commit snapshot and pending alert intentions
        if: inputs.mode != 'dry-run' && github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rankings.json automation/state/ranking_alerts.json
          if ! git diff --staged --quiet; then
            git commit -m "data: update rankings.json [automated]"
            if ! git push; then
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push
            fi
          fi

      - name: Deliver pending alerts
        if: inputs.mode != 'dry-run' && github.event_name != 'push'
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
        run: python scripts/update_rankings.py deliver --provider callmebot

      - name: Commit delivery receipts
        if: always() && inputs.mode != 'dry-run' && github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add automation/state/ranking_alerts.json
          if ! git diff --staged --quiet; then
            git commit -m "data: record ranking alert delivery [automated]"
            if ! git push; then
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push
            fi
          fi
