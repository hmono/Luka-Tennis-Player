name: Update ATP Rankings

# Recheck Tuesday–Friday at 09:00 BRT. GitHub cron can start late; timing is
# recorded separately from the Thursday 12:00 BRT publication deadline.
on:
  schedule:
    - cron: '0 12 * * 2-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'collect-and-deliver persists and notifies; dry-run only validates the live source'
        type: choice
        options:
          - collect-and-deliver
          - dry-run
        default: dry-run

permissions:
  contents: write
  actions: read

concurrency:
  group: repository-data-writer-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record expected slot and actual workflow start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '{created_at: .created_at, run_started_at: .run_started_at}' > "${RUNNER_TEMP}/atp-run-timing.json"
          python scripts/update_rankings.py telemetry --event-name "${GITHUB_EVENT_NAME}" --run-metadata "${RUNNER_TEMP}/atp-run-timing.json"

      - name: Require explicit release for collect-and-deliver
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'collect-and-deliver' && vars.ATP_RANKING_DELIVERY_ENABLED != 'true'
        run: |
          echo 'ATP collection and delivery remain disabled. Set ATP_RANKING_DELIVERY_ENABLED=true only after release approval.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Install automation dependencies
        run: pip install -r requirements-automation.txt

      - name: Install Chromium
        run: playwright install chromium --with-deps

      - name: Run ranking-alert tests
        run: python -m unittest discover -s tests/ranking_alerts

      - name: Dry run against the live ITF source
        if: inputs.mode == 'dry-run' || (github.event_name == 'schedule' && vars.ATP_RANKING_DELIVERY_ENABLED != 'true')
        run: python scripts/update_rankings.py dry-run --source itf

      - name: Collect ranking snapshot
        if: vars.ATP_RANKING_DELIVERY_ENABLED == 'true' && inputs.mode != 'dry-run'
        run: python scripts/update_rankings.py collect --source itf

      - name: Commit snapshot and pending alert intentions
        if: vars.ATP_RANKING_DELIVERY_ENABLED == 'true' && inputs.mode != 'dry-run'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rankings.json automation/state/ranking_alerts.json
          if ! git diff --staged --quiet; then
            git commit -m "data: update rankings.json [automated]"
            if ! git push; then
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push
            fi
          fi

      - name: Deliver pending alerts
        if: vars.ATP_RANKING_DELIVERY_ENABLED == 'true' && inputs.mode != 'dry-run'
        env:
          ATP_RANKING_DELIVERY_ENABLED: ${{ vars.ATP_RANKING_DELIVERY_ENABLED }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
        run: python scripts/update_rankings.py deliver --provider callmebot

      - name: Commit delivery receipts
        if: always() && vars.ATP_RANKING_DELIVERY_ENABLED == 'true' && inputs.mode != 'dry-run'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add automation/state/ranking_alerts.json
          if ! git diff --staged --quiet; then
            git commit -m "data: record ranking alert delivery [automated]"
            if ! git push; then
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push
            fi
          fi
