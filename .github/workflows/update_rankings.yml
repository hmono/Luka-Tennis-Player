name: Update ATP Rankings

# Tuesday–Friday 09:00 BRT, plus Thursday 12:05 BRT after the publication cutoff.
# GitHub cron is best-effort; actual scheduling delay is recorded separately.
on:
  schedule:
    - cron: '0 12 * * 2-5'
    - cron: '5 15 * * 4'
  workflow_dispatch:
    inputs:
      mode:
        description: 'collect-and-deliver persists and notifies; dry-run only validates the live source'
        type: choice
        options:
          - collect-and-deliver
          - dry-run
        default: dry-run

permissions:
  contents: write
  actions: read

concurrency:
  group: repository-data-writer-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # A queued writer must see receipts pushed by the preceding run.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record expected slot and actual workflow start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '{created_at: .created_at, run_started_at: .run_started_at}' > "${RUNNER_TEMP}/atp-run-timing.json"
          python scripts/update_rankings.py telemetry --event-name "${GITHUB_EVENT_NAME}" --run-metadata "${RUNNER_TEMP}/atp-run-timing.json"

      - name: Require explicit release for collect-and-deliver
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'collect-and-deliver' && (vars.ATP_RANKING_DELIVERY_ENABLED != 'true' || github.ref != 'refs/heads/main')
        run: |
          echo 'Collection and delivery require main and explicit release approval via ATP_RANKING_DELIVERY_ENABLED=true.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Install automation dependencies
        run: pip install -r requirements-automation.txt

      - name: Install Chromium
        run: playwright install chromium --with-deps

      - name: Run ranking-alert tests
        run: python -m unittest discover -s tests/ranking_alerts

      - name: Dry run against the live ITF source
        if: inputs.mode == 'dry-run' || (github.event_name == 'schedule' && vars.ATP_RANKING_DELIVERY_ENABLED != 'true')
        run: python scripts/update_rankings.py dry-run --source itf

      - name: Collect ranking snapshot
        id: collect
        if: vars.ATP_RANKING_DELIVERY_ENABLED == 'true' && inputs.mode != 'dry-run' && github.ref == 'refs/heads/main'
        run: python scripts/update_rankings.py collect --source itf

      - name: Commit snapshot and pending alert intentions
        id: persist
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') && vars.ATP_RANKING_DELIVERY_ENABLED == 'true' && inputs.mode != 'dry-run' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/update_rankings.py checkpoint

      - name: Deliver pending alerts
        id: deliver
        if: always() && steps.persist.outcome == 'success' && vars.ATP_RANKING_DELIVERY_ENABLED == 'true' && inputs.mode != 'dry-run' && github.ref == 'refs/heads/main'
        env:
          ATP_RANKING_DELIVERY_ENABLED: ${{ vars.ATP_RANKING_DELIVERY_ENABLED }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
        run: |
          if [ "${{ steps.collect.outputs.sporting_delivery_allowed }}" = "true" ]; then
            python scripts/update_rankings.py deliver --provider callmebot --durable-git
          else
            python scripts/update_rankings.py deliver --provider callmebot --durable-git --incidents-only
          fi

      - name: Commit delivery receipts
        if: always() && steps.persist.outcome == 'success' && (steps.deliver.outcome == 'success' || steps.deliver.outcome == 'failure') && vars.ATP_RANKING_DELIVERY_ENABLED == 'true' && inputs.mode != 'dry-run' && github.ref == 'refs/heads/main'
        run: python scripts/update_rankings.py checkpoint
