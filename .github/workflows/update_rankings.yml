name: Qualify ATP PDF Ranking Source

on:
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: 'Per-request timeout for the read-only live probe'
        type: choice
        options:
          - '20'
          - '30'
          - '45'
        default: '20'

permissions:
  contents: read

concurrency:
  group: atp-pdf-source-qualification
  cancel-in-progress: false

jobs:
  probe:
    # Dedicated trusted runner only. Do not expose this label to untrusted PR jobs.
    runs-on: [self-hosted, macOS, atp-ranking]
    timeout-minutes: 10
    env:
      PYTHON_BIN: /opt/anaconda3/bin/python3
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner Python
        run: test -x "$PYTHON_BIN" && "$PYTHON_BIN" --version

      - name: Install automation dependencies
        run: |
          "$PYTHON_BIN" -m venv .venv
          .venv/bin/python -m pip install -r requirements-automation.txt

      - name: Run ranking-alert tests
        run: .venv/bin/python -m unittest discover -s tests/ranking_alerts

      - name: Probe official ATP PDFs without persistence or notifications
        run: .venv/bin/python scripts/probe_atp_pdfs.py --timeout-seconds "${{ inputs.timeout_seconds }}"
