name: Update Physiology Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-data-writer-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - run: python scripts/update_physiology.py
        env:
          WHOOP_ACCESS_TOKEN: ${{ secrets.WHOOP_ACCESS_TOKEN }}
          WHOOP_REFRESH_TOKEN: ${{ secrets.WHOOP_REFRESH_TOKEN }}
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/physiology.json
          if ! git diff --staged --quiet; then
            git commit -m "data: update physiology.json [automated]"
            if ! git push; then
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push
            fi
          fi
