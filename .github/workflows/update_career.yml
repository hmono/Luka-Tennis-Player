name: Update Career Data

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Lookback window in days (default 30; use ~120 for backfill)'
        default: '30'

permissions:
  contents: write

concurrency:
  group: repository-data-writer-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install playwright

      - name: Install Chromium
        run: playwright install chromium --with-deps

      - name: Run scraper
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '30' }}
        run: python scripts/update_career.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/career.json
          if ! git diff --staged --quiet; then
            git commit -m "data: update career.json [automated]"
            if ! git push; then
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push
            fi
          fi
